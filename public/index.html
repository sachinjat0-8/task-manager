<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task manager">
    <title>Taskflow | Task Manager</title>
    <!-- load external fonts and icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- our own styles and code -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- glowing circles behind the app -->
    <div class="background-elements">
        <div class="blur-blob top-left"></div>
        <div class="blur-blob bottom-right"></div>
    </div>

    <!-- main wrapper holding everything -->
    <div class="app-container">
        <header class="header">
            <div class="branding">
                <div class="logo-wrapper">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1>Taskflow</h1>
            </div>
            <p class="subtitle">Focus on what matters today.</p>
        </header>

        <main>
            <!-- box to type a new task -->
            <div class="input-section glass-panel">
                <form id="task-form" class="task-form">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-pen input-icon"></i>
                        <input type="text" id="task-input" placeholder="What do you need to get done?" autocomplete="off" required>
                    </div>
                    <button type="submit" class="add-btn" id="add-btn">
                        <span>Add</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <div id="error-message" class="error-message hidden">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text"></span>
                </div>
            </div>

            <!-- title and counter above the list -->
            <div class="tasks-header">
                <h2>Your Tasks</h2>
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span id="task-count">0 tasks</span>
                </div>
            </div>

            <!-- list area -->
            <div class="tasks-container">
                <!-- spinner hides once task list loads -->
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Syncing tasks...</p>
                </div>

                <ul id="task-list" class="task-list"></ul>

                <!-- this shows if there are zero tasks created -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon-wrapper">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                    <h3>All caught up!</h3>
                    <p>Enjoy your free time or add a new task.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- tiny success message at the bottom of the screen -->
    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <i class="fa-solid fa-circle-check toast-icon"></i>
            <span id="toast-message">Success</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
